name: Probe companies (temporary)
on: { push: { branches: [probe-companies] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - run: |
          while IFS= read -r c; do
            echo "=== $c"; timeout 120 python job_monitor.py --show-matches --company "$c" 2>&1 | tail -4
          done < .github/probe/new.txt
